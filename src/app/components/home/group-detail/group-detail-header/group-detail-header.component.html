<div class="image-wrap">
  <img class="group-image" [src]="groupDetail.groupImage" alt="Group image" />
</div>

<div class="hero-content">
  <div class="title-row">
    <h1 class="group-title">{{ groupDetail.title }}</h1>
  </div>

  <div class="meta">
    <div class="meta-item">
      <span class="label">Creator</span>
      <span class="value">{{ groupDetail.user.fullName }}</span>
    </div>
    <div class="meta-item">
      <span class="label">Members</span>
      <span class="value">{{ groupDetail.userGroups.length }}</span>
    </div>
    <div class="meta-item">
      <span class="label">Created On</span>
      <span class="value">{{
        groupDetail.createdOn | date : "MM/dd/yyyy"
      }}</span>
    </div>
  </div>

  <p class="group-desc">
    Trip expenses and hotel split for the weekend. Add notes or a short
    description here.
  </p>
</div>
