<div class="toast-wrap" aria-live="polite" aria-atomic="true">
  <div
    class="toast"
    *ngFor="let t of toasterService.toasts$ | async"
    [ngClass]="t.level"
    role="status"
  >
    <div class="icon" [ngClass]="t.level" aria-hidden="true">
      <span *ngIf="t.level === 'success'">✔</span>
      <span *ngIf="t.level === 'error'">✖</span>
      <span *ngIf="t.level === 'info'">ℹ</span>
    </div>
    <div class="content">
      <div class="title" *ngIf="t.title">{{ t.title }}</div>
      <div class="msg">{{ t.message }}</div>
    </div>
    <button
      class="close"
      (click)="toasterService.remove(t.id)"
      aria-label="Dismiss"
    >
      ×
    </button>
  </div>
</div>
